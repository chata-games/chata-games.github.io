name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            forest-rescue/package-lock.json
            trolluv-sklep/package-lock.json
      - name: Build Forest Rescue
        working-directory: forest-rescue
        run: |
          npm ci
          npm run build:app
      - name: Build Trolluv Sklep
        working-directory: trolluv-sklep
        run: |
          npm ci
          npm run build
      - name: Stage site
        run: ./scripts/stage-pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - id: deployment
        uses: actions/deploy-pages@v4
